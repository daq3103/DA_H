<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Xe - MotoShop</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3 border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary-moto" href="index.html">MotoShop</a>
            <div class="d-flex align-items-center gap-3">
                <a href="cart.html" class="position-relative text-dark fs-5 head-icon-btn d-flex align-items-center justify-content-center">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">0</span>
                </a>
                <div id="user-auth-area" class="position-relative"></div>
            </div>
        </div>
    </nav>

    <div class="container py-4" id="product-detail-container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb" id="product-breadcrumb">
                <!-- Breadcrumb loaded via JS -->
            </ol>
        </nav>

        <div class="row" id="product-main-view">
            <!-- Loading -->
            <div class="col-12 text-center py-5 px-5">
                <div class="spinner-border text-primary-moto my-5" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
        
        <!-- Specs and Details Section -->
        <div class="row mt-5 pt-4 border-top">
            <div class="col-lg-8 mb-5">
                <h4 class="fw-bold mb-4">Thông Số Kỹ Thuật</h4>
                <div class="table-responsive bg-light p-4 rounded-3">
                    <table class="table table-borderless specs-table mb-0" id="specs-table">
                        <!-- Loaded via JS -->
                    </table>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="bg-light p-4 rounded-3 border">
                    <h5 class="fw-bold mb-3"><i class="fas fa-headset text-primary-moto me-2"></i> Yêu cầu tư vấn ngay</h5>
                    <p class="small text-muted mb-4">Để lại thông tin, nhân viên kinh doanh của chúng tôi sẽ liên hệ báo giá lăn bánh tốt nhất cho bạn.</p>
                    
                    <form id="leadForm">
                        <div class="mb-3">
                            <input type="text" id="lead-name" class="form-control" placeholder="Họ và Tên *" required>
                        </div>
                        <div class="mb-3">
                            <input type="tel" id="lead-phone" class="form-control" placeholder="Số điện thoại *" required>
                        </div>
                        <div class="mb-3">
                            <textarea id="lead-message" class="form-control" rows="3" placeholder="Lời nhắn (Ví dụ: Tôi muốn hỏi giá lăn bánh biển Hà Nội)"></textarea>
                        </div>
                        <button type="submit" id="lead-submit-btn" class="btn btn-dark w-100 fw-medium">Gửi Yêu Cầu</button>
                    </form>
                    <script>
                        document.getElementById('leadForm').addEventListener('submit', async function(e) {
                            e.preventDefault();
                            const btn = document.getElementById('lead-submit-btn');
                            btn.disabled = true;
                            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang gửi...';

                            // Lấy tên sản phẩm đang xem để ghi kèm
                            const productName = document.querySelector('#product-main-view h2')?.textContent || '';
                            const userMessage = document.getElementById('lead-message').value.trim();
                            const fullMessage = productName 
                                ? `[Yêu cầu tư vấn - ${productName}] ${userMessage}` 
                                : userMessage || 'Yêu cầu tư vấn báo giá';

                            const payload = {
                                full_name: document.getElementById('lead-name').value.trim(),
                                phone: document.getElementById('lead-phone').value.trim(),
                                email: null,
                                message: fullMessage
                            };

                            try {
                                const res = await fetch('api/admin_contacts.php', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                const data = await res.json();
                                if (data.error) {
                                    showToast(data.message || 'Có lỗi xảy ra!', 'danger');
                                } else {
                                    showToast('Gửi yêu cầu thành công! Nhân viên sẽ liên hệ bạn sớm nhất.', 'success', 4000);
                                    e.target.reset();
                                }
                            } catch (err) {
                                showToast('Không thể kết nối máy chủ. Vui lòng thử lại!', 'danger');
                            } finally {
                                btn.disabled = false;
                                btn.innerHTML = 'Gửi Yêu Cầu';
                            }
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared/moto-shared.js"></script>
    <script src="js/main.js"></script>
    <script src="js/main-bootstrap.js"></script>
</body>
</html>
