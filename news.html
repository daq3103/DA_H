<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức & Kinh Nghiệm - MotoShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3 border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary-moto align-items-center d-flex" href="index.html">
                <i class="fas fa-motorcycle me-2"></i> MotoShop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="products.html">Sản phẩm</a></li>
                    <li class="nav-item"><a class="nav-link active px-3" href="news.html">Tin tức</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="contact.html">Liên hệ</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="cart.html" class="position-relative text-dark fs-5 head-icon-btn d-flex align-items-center justify-content-center">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">0</span>
                    </a>
                    <div id="user-auth-area" class="position-relative"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="bg-dark text-white py-5" style="background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1558980394-0a37c6ce74fa?q=80&w=2000'); background-size: cover; background-position: center;">
        <div class="container text-center py-4">
            <h1 class="display-4 fw-bold mb-3">Tin Tức & Kinh Nghiệm</h1>
            <p class="lead opacity-75">Cập nhật tin tức thị trường và kinh nghiệm chăm sóc xe mới nhất</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container py-5 my-3">
        <div class="row g-4" id="news-grid">
            <!-- Loading -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary-moto" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared/moto-shared.js"></script>
    <script src="js/main.js"></script>
    <script src="js/main-bootstrap.js"></script>
    <script>
        // Dữ liệu tĩnh fallback khi không kết nối được DB
        const STATIC_NEWS = [
            {
                title: 'Bảo dưỡng xe tay ga định kỳ: Những mốc thời gian không thể bỏ qua',
                thumbnail_url: 'https://images.unsplash.com/photo-1591637333184-19aa84b3e01f?q=80&w=600&auto=format&fit=crop',
                summary: 'Thay nhớt máy, nhớt láp, kiểm tra lốp và phanh là những hạng mục cần thiết để giữ xe ở trạng thái tốt nhất...',
                category: 'Kinh Nghiệm',
                published_at: '2024-03-12'
            },
            {
                title: 'Top 5 mẫu xe côn tay lý tưởng nhất tầm giá dưới 50 triệu năm nay',
                thumbnail_url: 'https://images.unsplash.com/photo-1568772585407-9361f9bf3c87?q=80&w=600&auto=format&fit=crop',
                summary: 'Winner X hay Exciter? Đâu là lựa chọn được anh em đánh giá cao về hiệu năng lẫn thiết kế thể thao?',
                category: 'Thị Trường',
                published_at: '2024-03-10'
            },
            {
                title: 'Honda ra mắt SH 160i mới: Thiết kế đột phá, nâng cấp công nghệ eSP+',
                thumbnail_url: 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?q=80&w=600&auto=format&fit=crop',
                summary: 'Không chỉ sở hữu diện mạo đẳng cấp châu Âu, phiên bản mới nhất mang đến hiệu suất vượt trội cùng tiện ích thông minh.',
                category: 'Sự Kiện',
                published_at: '2024-03-05'
            }
        ];

        function renderNewsCards(newsList) {
            const grid = document.getElementById('news-grid');
            if (!newsList || newsList.length === 0) {
                grid.innerHTML = `<div class="col-12 text-center py-5"><h5 class="text-muted">Chưa có bài viết nào.</h5></div>`;
                return;
            }
            grid.innerHTML = newsList.map(n => {
                const date = n.published_at ? new Date(n.published_at).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
                const imgUrl = n.thumbnail_url || 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?q=80&w=600';
                const category = n.category || 'Tin tức';
                return `
                <div class="col-lg-4 col-md-6">
                    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                        <img src="${imgUrl}" class="card-img-top object-fit-cover" alt="${n.title}" style="height: 220px;">
                        <div class="card-body p-4 d-flex flex-column">
                            <span class="badge bg-light text-primary-moto mb-3 w-auto align-self-start py-2 px-3 fw-bold border">${category}</span>
                            <h5 class="card-title fw-bold mb-3 line-clamp-2">
                                <span class="text-dark">${n.title}</span>
                            </h5>
                            <p class="card-text text-muted small flex-grow-1">${n.summary || ''}</p>
                            <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                                <span class="small text-muted"><i class="far fa-clock me-1"></i> ${date}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Load tin tức từ API, fallback về dữ liệu tĩnh
        (async function() {
            try {
                const res = await fetch('api/admin_news.php');
                const data = await res.json();
                if (data.error || !Array.isArray(data) || data.length === 0) {
                    renderNewsCards(STATIC_NEWS);
                } else {
                    renderNewsCards(data);
                }
            } catch (err) {
                renderNewsCards(STATIC_NEWS);
            }
        })();
    </script>
</body>
</html>
