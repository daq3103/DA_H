<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - MotoShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <div class="admin-login-page">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-motorcycle"></i>
                <h2>MotoShop Admin</h2>
                <p>Đăng nhập để quản lý hệ thống</p>
            </div>

            <div class="login-error" id="login-error">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="login-error-msg">Sai tên đăng nhập hoặc mật khẩu</span>
            </div>

            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="Email hoặc SĐT" required autocomplete="username">
                    <label for="username"><i class="fas fa-envelope me-2"></i>Email hoặc SĐT</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required autocomplete="current-password">
                    <label for="password"><i class="fas fa-lock me-2"></i>Mật khẩu</label>
                </div>
                <button type="submit" class="btn-login" id="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="../index.html" class="text-muted text-decoration-none" style="font-size: 0.85rem;">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại trang chủ
                </a>
            </div>

            <div class="text-center mt-3" style="font-size:0.75rem; color: #aaa;">
                Mặc định: <strong>admin@motoshop.vn</strong> / <strong>admin123</strong>
            </div>
        </div>
    </div>

    <script>
        // If already logged in, redirect
        if (localStorage.getItem('motoshop_admin')) {
            window.location.href = 'index.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('login-error');
            const errMsg = document.getElementById('login-error-msg');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
            errBox.style.display = 'none';

            try {
                const res = await fetch('../api/admin_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('motoshop_admin', JSON.stringify(data.admin));
                    window.location.href = 'index.html';
                } else {
                    errMsg.textContent = data.message || 'Sai tên đăng nhập hoặc mật khẩu';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                // Demo mode: allow login with hardcoded credentials
                if (username === 'admin@motoshop.vn' && password === 'admin123') {
                    localStorage.setItem('motoshop_admin', JSON.stringify({
                        id: 1, username: 'admin@motoshop.vn', full_name: 'Quản Trị Viên', role: 'admin'
                    }));
                    window.location.href = 'index.html';
                } else {
                    errMsg.textContent = 'Sai tên đăng nhập hoặc mật khẩu (Demo mode)';
                    errBox.style.display = 'block';
                }
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập';
        });
    </script>
</body>
</html>
