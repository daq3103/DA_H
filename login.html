<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - MotoShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html" class="text-decoration-none">
                    <i class="fas fa-motorcycle"></i>
                    <h2>MotoShop</h2>
                </a>
                <p>Đăng nhập vào tài khoản của bạn</p>
            </div>

            <div class="auth-error" id="auth-error">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="auth-error-msg">Sai thông tin đăng nhập</span>
            </div>

            <div class="auth-success" id="auth-success">
                <i class="fas fa-check-circle me-2"></i>
                <span id="auth-success-msg"></span>
            </div>

            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="Email hoặc SĐT" required autocomplete="username">
                    <label for="username"><i class="fas fa-user me-2"></i>Email hoặc Số điện thoại</label>
                </div>
                <div class="form-floating mb-3 position-relative">
                    <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required autocomplete="current-password">
                    <label for="password"><i class="fas fa-lock me-2"></i>Mật khẩu</label>
                    <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted border-0 pe-3" onclick="togglePassword('password', this)" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="btn-auth-submit" id="btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
                </button>
            </form>

            <div class="auth-divider">
                <span>hoặc</span>
            </div>

            <div class="text-center">
                <p class="mb-0 text-muted">Chưa có tài khoản?
                    <a href="register.html" class="text-primary-moto fw-bold text-decoration-none">Đăng ký ngay</a>
                </p>
            </div>

            <div class="text-center mt-4">
                <a href="index.html" class="text-muted text-decoration-none" style="font-size: 0.85rem;">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại trang chủ
                </a>
            </div>
        </div>
    </div>

    <script>
        // Tự động chuyển sang localhost nếu mở bằng file://
        if (window.location.protocol === 'file:') {
            const m = window.location.pathname.match(/\/shop\/(.*)/i);
            if (m) { window.location.href = 'http://localhost/shop/' + (m[1] || 'login.html'); }
        }

        const urlParams = new URLSearchParams(window.location.search);

        // Nếu đã đăng nhập → quay lại trang trước (hoặc trang chủ)
        if (localStorage.getItem('motoshop_user')) {
            window.location.href = urlParams.get('redirect') || 'index.html';
        }

        // Hiện thông báo nếu vừa đăng ký xong
        if (urlParams.get('registered') === '1') {
            const successBox = document.getElementById('auth-success');
            document.getElementById('auth-success-msg').textContent = 'Đăng ký thành công! Hãy đăng nhập.';
            successBox.style.display = 'block';
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('auth-error');
            const errMsg = document.getElementById('auth-error-msg');
            const successBox = document.getElementById('auth-success');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
            errBox.style.display = 'none';
            successBox.style.display = 'none';

            try {
                const res = await fetch('api/user_auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('motoshop_user', JSON.stringify(data.user));
                    // Nếu là admin hoặc staff thì phải lưu thêm session của admin
                    if (data.user.role === 'admin' || data.user.role === 'staff') {
                        localStorage.setItem('motoshop_admin', JSON.stringify(data.user));
                    }
                    
                    // Admin/staff → chuyển tới trang quản trị, customer → trang chủ
                    const defaultRedirect = (data.user.role === 'admin' || data.user.role === 'staff') ? 'admin/index.html' : 'index.html';
                    const redirect = urlParams.get('redirect') || defaultRedirect;
                    window.location.href = redirect;
                } else {
                    errMsg.textContent = data.message || 'Sai thông tin đăng nhập';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errMsg.textContent = 'Không thể kết nối tới server. Hãy chắc chắn XAMPP đang chạy!';
                errBox.style.display = 'block';
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập';
        });
    </script>
</body>
</html>
