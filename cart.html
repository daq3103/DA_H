<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - MotoShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3 border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary-moto" href="index.html">MotoShop</a>
            <div class="d-flex align-items-center gap-3">
                <a href="products.html" class="btn btn-outline-dark rounded-pill btn-sm d-none d-md-block">Tiếp Tục Mua Sắm</a>
                <a href="cart.html" class="position-relative text-dark fs-5 head-icon-btn d-flex align-items-center justify-content-center">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">0</span>
                </a>
                <div id="user-auth-area" class="position-relative"></div>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="fw-bold mb-4">Giỏ Hàng Của Bạn</h2>

        <div class="row" id="cart-view-container">
            <!-- Table Giỏ hàng (Bên trái) -->
            <div class="col-lg-8 mb-4 mb-lg-0">
                <div class="bg-white rounded-3 shadow-sm border border-light p-4 overflow-auto">
                    <table class="table table-borderless align-middle mb-0">
                        <thead class="border-bottom text-muted">
                            <tr>
                                <th>Sản Phẩm</th>
                                <th class="text-center">Đơn Giá</th>
                                <th class="text-center">Số Lượng</th>
                                <th class="text-end">Tạm Tính</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-items-container">
                            <!-- JS sẽ load dữ liệu vào đây -->
                            <tr><td colspan="5" class="text-center py-4">Đang tải giỏ hàng...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Form Đặt hàng (Bên phải) -->
            <div class="col-lg-4">
                <div class="bg-white rounded-3 shadow-sm border border-light p-4" id="checkout-form-container">
                    <h5 class="fw-bold border-bottom pb-3 mb-4">Thông Tin Đặt Hàng</h5>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tổng cộng (Tạm tính)</span>
                        <span class="fw-bold text-dark" id="cart-total-tmp">0 VNĐ</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4 border-bottom pb-3">
                        <span class="text-muted">Phí vận chuyển</span>
                        <span class="text-success fw-medium">Miễn phí (Nội thành HN)</span>
                    </div>

                    <!-- Mã giảm giá -->
                    <div class="mb-3 border-bottom pb-3" id="coupon-section">
                        <label class="form-label small text-muted fw-bold"><i class="fas fa-ticket-alt me-1"></i>Mã Giảm Giá</label>
                        <div class="input-group">
                            <input type="text" class="form-control text-uppercase" id="coupon-input" placeholder="Nhập mã giảm giá..." style="letter-spacing: 1px;">
                            <button class="btn btn-outline-dark" type="button" id="btn-apply-coupon" onclick="applyCoupon()">Áp dụng</button>
                        </div>
                        <div id="coupon-message" class="small mt-2" style="display:none;"></div>
                        <div id="coupon-applied" class="d-none mt-2 p-2 rounded" style="background:#d1fae5;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="text-success fw-bold small" id="coupon-code-display"></span>
                                    <span class="text-muted small ms-1" id="coupon-desc-display"></span>
                                </div>
                                <button class="btn btn-sm text-danger p-0" onclick="removeCoupon()" title="Xóa mã"><i class="fas fa-times"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Giảm giá -->
                    <div class="d-flex justify-content-between mb-2 d-none" id="discount-row">
                        <span class="text-muted">Giảm giá</span>
                        <span class="fw-bold text-success" id="cart-discount">- 0 ₫</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Thành tiền</span>
                        <span class="fw-bold fs-4 text-primary-moto" id="cart-total-final">0 VNĐ</span>
                    </div>

                    <form id="checkout-form" onsubmit="handleCheckout(event)">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Họ và Tên *</label>
                            <input type="text" class="form-control" id="co_name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Số Điện Thoại *</label>
                            <input type="tel" class="form-control" id="co_phone" required pattern="[0-9]{10,11}" title="Vui lòng nhập 10-11 số hợp lệ">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Địa Chỉ Nhận Xe / SR Cần Tới *</label>
                            <input type="text" class="form-control" id="co_address" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-muted">Ghi Chú Đơn Hàng</label>
                            <textarea class="form-control" rows="2" id="co_note"></textarea>
                        </div>
                        <button type="submit" class="btn btn-moto-primary w-100 fw-bold py-3 text-uppercase fs-6 shadow-sm rounded-pill" id="btn-checkout">Xác Nhận Đặt Hàng</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Trạng thái trống -->
        <div class="text-center py-5 d-none" id="empty-cart-view">
            <i class="fas fa-shopping-basket text-muted mb-4 opacity-50" style="font-size: 80px;"></i>
            <h3 class="fw-bold mb-3">Giỏ hàng trống</h3>
            <p class="text-muted mb-4">Bạn chưa chọn chiếc xe nào để đồng hành.</p>
            <a href="products.html" class="btn btn-dark btn-lg rounded-pill px-5">Khám Phá Xe Ngay</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared/moto-shared.js"></script>
    <script src="js/main.js"></script>
    <script src="js/main-bootstrap.js"></script>
</body>
</html>
